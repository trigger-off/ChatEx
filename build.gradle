plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'de.jeter'
version = '3.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    maven { url = 'https://repo.essentialsx.net/releases/' }
    maven { url = 'https://repo.purpurmc.org/snapshots' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.27'
    compileOnly 'net.kyori:adventure-api:4.9.3'
    compileOnly 'net.kyori:adventure-text-serializer-legacy:4.9.3'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'net.ess3:EssentialsX:2.18.2'
    compileOnly 'org.purpurmc.purpur:purpur-api:1.18.2-R0.1-SNAPSHOT'

    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.github.TheJeterLP:Spigot-Updatechecker:2.0.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project: [name: project.name, version: project.version])
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    relocate 'org.bstats', 'de.jeter.chatex.bstats'
    relocate 'de.jeter.updatechecker', 'de.jeter.chatex.updatechecker'
    archiveClassifier = ''
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
